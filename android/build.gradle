group = "io.mosip.inji_flutter_sdk"
version = "1.0.0"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "io.mosip.inji_flutter_sdk"

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 23
    }

    packagingOptions {
        exclude "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
    }

    configurations.all {
        exclude group: "org.bouncycastle", module: "bcprov-jdk15to18"
        exclude group: "org.bouncycastle", module: "bcutil-jdk15to18"
        exclude group: "org.bouncycastle", module: "bcpkix-jdk15to18"
    }

    dependencies {
        // Pre-compiled SDK native code
        implementation(files("libs/inji_flutter_sdk-release.aar"))

        // Transitive dependencies required at runtime
        implementation("io.mosip:inji-vci-client-aar:0.6.0")
        implementation("io.mosip:inji-openid4vp-aar:0.6.0")
        implementation("io.inji:vcverifier-aar:1.7.0")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    }
}

group = "io.mosip.inji_flutter_sdk"
version = "1.0.0"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        maven { url = uri("https://oss.sonatype.org/content/repositories/snapshots/") }
        maven { url = uri("https://repo.maven.apache.org/maven2/") }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "io.mosip.inji_flutter_sdk"

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 23
    }

    packagingOptions {
        exclude "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        exclude "META-INF/license.txt"
        exclude "META-INF/LICENSE.txt"
        exclude "META-INF/notice.txt"
        exclude "META-INF/NOTICE.txt"
        exclude "META-INF/DEPENDENCIES"
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }

    configurations.all {
        exclude group: "org.bouncycastle", module: "bcprov-jdk15to18"
        exclude group: "org.bouncycastle", module: "bcutil-jdk15to18"
        exclude group: "org.bouncycastle", module: "bcpkix-jdk15to18"
        exclude group: "info.weboftrust", module: "ld-signatures-java"
        exclude group: "decentralized-identity", module: "jsonld-common-java"
        exclude group: "com.google.crypto.tink", module: "tink"
        exclude group: "io.mosip", module: "vcverifier-jar"
    }

    dependencies {
        // Pre-compiled handler classes (extracted from AAR)
        implementation(files("libs/inji_flutter_sdk-handlers.jar"))

        // Transitive dependencies required at runtime
        implementation("io.mosip:secure-keystore:0.3.0")
        implementation("io.mosip:inji-vci-client-aar:0.6.0")
        implementation("io.mosip:inji-openid4vp-aar:0.5.0")
        implementation("io.mosip:vcverifier-aar:1.6.0")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    }
}
